<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meme Fights - Suzume vs Greedy Wife</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin: 10px 0 4px;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      color: #ffde59;
      text-shadow: 0 0 12px #ff9f1c;
    }
    #subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      background: linear-gradient(#7ec8e3 0%, #a8e063 55%, #56ab2f 100%);
      border: 3px solid #fff;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    /* Mobile Controls */
    #mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 12px 10px;
      gap: 10px;
    }
    .ctrl-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .btn:active, .btn.active {
      background: rgba(255, 200, 50, 0.7);
      transform: scale(0.94);
    }
    .btn-special {
      background: rgba(255, 80, 0, 0.5);
      border-color: #ff9f1c;
    }

    .desktop-hint {
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.7;
      text-align: center;
    }
    @media (max-width: 700px) {
      .desktop-hint { display: none; }
    }
    @media (min-width: 701px) {
      #mobile-controls { display: none; }
    }
  </style>
</head>
<body>
  <h1>MEME FIGHTS</h1>
  <div id="subtitle">Sparrow vs Greedy Wife</div>

  <div id="game-container">
    <canvas id="game" width="800" height="400"></canvas>
  </div>

  <!-- Mobile Touch Controls -->
  <div id="mobile-controls">
    <div class="ctrl-group">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
      <div class="btn" id="btn-jump">▲</div>
    </div>
    <div class="ctrl-group">
      <div class="btn" id="btn-punch">P</div>
      <div class="btn" id="btn-kick">K</div>
      <div class="btn btn-special" id="btn-special">SP</div>
    </div>
  </div>

  <div class="desktop-hint">
    Keyboard: ← → Move | ↑ Jump | Z Punch | X Kick | C Special
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const GROUND = H - 58;

    // ===== SOUND PLACEHOLDERS =====
    // Replace these with real Audio objects later, e.g.:
    // const sfx = { punch: new Audio('sounds/punch.mp3'), ... }
    const sfx = {
      punch:   () => console.log('%c🔊 Punch', 'color:#ff0'),
      kick:    () => console.log('%c🔊 Kick', 'color:#0ff'),
      special: () => console.log('%c🔊 Special', 'color:#f80'),
      hit:     () => console.log('%c🔊 Hit', 'color:#f44'),
      jump:    () => console.log('%c🔊 Jump', 'color:#8f8'),
      win:     () => console.log('%c🔊 Win Round', 'color:#0f0'),
      lose:    () => console.log('%c🔊 Lose Round', 'color:#f00')
    };
    function play(name) {
      if (sfx[name]) sfx[name]();
    }

    // ===== Characters =====
    const player = {
      x: 140, y: GROUND, w: 52, h: 72,
      vx: 0, vy: 0, speed: 5.2, jumpForce: -15,
      health: 100, maxHealth: 100,
      facing: 1,
      state: 'idle',
      attackTimer: 0,
      cooldown: 0,
      wins: 0
    };

    const enemy = {
      x: 610, y: GROUND, w: 56, h: 76,
      vx: 0, vy: 0, speed: 3.1,
      health: 100, maxHealth: 100,
      facing: -1,
      state: 'idle',
      attackTimer: 0,
      cooldown: 0,
      wins: 0,
      aiTimer: 0
    };

    let keys = {};
    let touch = { left:false, right:false, jump:false, punch:false, kick:false, special:false };
    let round = 1;
    let roundOver = false;
    let gameOver = false;
    let message = '';
    let messageTimer = 0;

    // ===== Input - Keyboard =====
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // ===== Input - Touch =====
    function setupButton(id, key) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); touch[key] = true; el.classList.add('active'); };
      const end   = (e) => { e.preventDefault(); touch[key] = false; el.classList.remove('active'); };
      el.addEventListener('touchstart', start, {passive:false});
      el.addEventListener('touchend', end, {passive:false});
      el.addEventListener('touchcancel', end, {passive:false});
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    }
    setupButton('btn-left', 'left');
    setupButton('btn-right', 'right');
    setupButton('btn-jump', 'jump');
    setupButton('btn-punch', 'punch');
    setupButton('btn-kick', 'kick');
    setupButton('btn-special', 'special');

    // ===== Helpers =====
    function rectsCollide(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ===== Drawing =====
    function drawBackground() {
      // Sky gradient already on canvas CSS, but we reinforce
      // Bamboo
      for (let i = 0; i < 14; i++) {
        const x = 25 + i * 58;
        // stalk
        ctx.fillStyle = '#2f5e28';
        ctx.fillRect(x, 0, 16, H - 45);
        // highlights
        ctx.fillStyle = '#3d7a34';
        ctx.fillRect(x + 3, 0, 4, H - 45);
        // nodes
        ctx.strokeStyle = '#1e3d1a';
        ctx.lineWidth = 2;
        for (let y = 50; y < H - 60; y += 48) {
          ctx.beginPath();
          ctx.moveTo(x - 1, y);
          ctx.lineTo(x + 17, y);
          ctx.stroke();
        }
      }
      // Ground
      ctx.fillStyle = '#4a3728';
      ctx.fillRect(0, GROUND + 38, W, 40);
      ctx.fillStyle = '#5c4634';
      ctx.fillRect(0, GROUND + 38, W, 8);
    }

    function drawHealthBars() {
      // Player bar
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(20, 14, 310, 28);
      ctx.fillStyle = '#00e676';
      ctx.fillRect(22, 16, 306 * (player.health / player.maxHealth), 24);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 14, 310, 28);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.fillText('SPARROW', 28, 12);

      // Enemy bar
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(W - 330, 14, 310, 28);
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(W - 328, 16, 306 * (enemy.health / enemy.maxHealth), 24);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(W - 330, 14, 310, 28);
      ctx.fillStyle = '#fff';
      ctx.fillText('GREEDY WIFE', W - 322, 12);

      // Round
      ctx.font = 'bold 17px Arial';
      ctx.fillStyle = '#ffde59';
      ctx.textAlign = 'center';
      ctx.fillText(`ROUND ${round}   ${player.wins} - ${enemy.wins}`, W/2, 32);
      ctx.textAlign = 'left';
    }

    function drawSparrow(p) {
      ctx.save();
      ctx.translate(p.x + p.w/2, p.y + p.h/2);
      ctx.scale(p.facing, 1);

      // Tail
      ctx.fillStyle = '#e76f51';
      ctx.beginPath();
      ctx.moveTo(-18, 15);
      ctx.quadraticCurveTo(-35, 5, -28, 30);
      ctx.quadraticCurveTo(-15, 25, -18, 15);
      ctx.fill();

      // Body
      ctx.fillStyle = '#f4a261';
      ctx.beginPath();
      ctx.ellipse(0, 8, 23, 29, 0, 0, Math.PI*2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#d62828';
      ctx.beginPath();
      ctx.ellipse(-6, 5, 14, 20, -0.5, 0, Math.PI*2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#e76f51';
      ctx.beginPath();
      ctx.arc(2, -24, 17, 0, Math.PI*2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.moveTo(16, -24);
      ctx.lineTo(32, -20);
      ctx.lineTo(16, -15);
      ctx.closePath();
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(8, -27, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(9, -27, 2.5, 0, Math.PI*2);
      ctx.fill();

      // Attack visuals
      if (p.state === 'punch' && p.attackTimer > 8) {
        ctx.fillStyle = 'rgba(255,255,100,0.75)';
        ctx.beginPath();
        ctx.arc(36, -5, 16, 0, Math.PI*2);
        ctx.fill();
      }
      if (p.state === 'kick' && p.attackTimer > 8) {
        ctx.fillStyle = 'rgba(100,220,255,0.75)';
        ctx.beginPath();
        ctx.ellipse(30, 18, 22, 10, 0, 0, Math.PI*2);
        ctx.fill();
      }
      if (p.state === 'special') {
        ctx.strokeStyle = 'rgba(255,140,0,0.8)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI*2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawWife(e) {
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);
      ctx.scale(e.facing, 1);

      // Dress
      ctx.fillStyle = '#9b2226';
      ctx.beginPath();
      ctx.moveTo(-24, -5);
      ctx.lineTo(24, -5);
      ctx.lineTo(28, 45);
      ctx.lineTo(-28, 45);
      ctx.closePath();
      ctx.fill();

      // Belt
      ctx.fillStyle = '#370617';
      ctx.fillRect(-25, 8, 50, 7);

      // Head
      ctx.fillStyle = '#f4d35e';
      ctx.beginPath();
      ctx.arc(0, -28, 19, 0, Math.PI*2);
      ctx.fill();

      // Hair bun
      ctx.fillStyle = '#240046';
      ctx.beginPath();
      ctx.arc(0, -42, 14, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-12, -32, 9, 0, Math.PI*2);
      ctx.arc(12, -32, 9, 0, Math.PI*2);
      ctx.fill();

      // Angry brows + eyes
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-11, -35);
      ctx.lineTo(-3, -32);
      ctx.moveTo(11, -35);
      ctx.lineTo(3, -32);
      ctx.stroke();

      ctx.fillStyle = '#000';
      ctx.fillRect(-9, -30, 5, 4);
      ctx.fillRect(4, -30, 5, 4);

      // Mouth
      ctx.beginPath();
      ctx.moveTo(-7, -18);
      ctx.lineTo(7, -18);
      ctx.stroke();

      if (e.state === 'punch' && e.attackTimer > 8) {
        ctx.fillStyle = 'rgba(255,50,50,0.7)';
        ctx.beginPath();
        ctx.arc(32, -2, 15, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
    }

    // ===== Update =====
    function updatePlayer() {
      if (roundOver || gameOver) return;

      player.vx = 0;
      if (keys['arrowleft'] || touch.left)  { player.vx = -player.speed; player.facing = -1; }
      if (keys['arrowright'] || touch.right){ player.vx =  player.speed; player.facing =  1; }

      if ((keys['arrowup'] || touch.jump) && player.y >= GROUND) {
        player.vy = player.jumpForce;
        play('jump');
      }

      if (player.cooldown <= 0) {
        if (keys['z'] || touch.punch) {
          player.state = 'punch';
          player.attackTimer = 22;
          player.cooldown = 26;
          play('punch');
        } else if (keys['x'] || touch.kick) {
          player.state = 'kick';
          player.attackTimer = 24;
          player.cooldown = 32;
          play('kick');
        } else if (keys['c'] || touch.special) {
          player.state = 'special';
          player.attackTimer = 30;
          player.cooldown = 55;
          player.vy = -9;
          play('special');
        }
      }

      player.vy += 0.72;
      player.x += player.vx;
      player.y += player.vy;

      if (player.y > GROUND) { player.y = GROUND; player.vy = 0; }
      player.x = Math.max(15, Math.min(W - player.w - 15, player.x));

      if (player.attackTimer > 0) player.attackTimer--;
      else player.state = 'idle';
      if (player.cooldown > 0) player.cooldown--;

      // Hit detection
      if (player.attackTimer > 12) {
        const hb = {
          x: player.facing === 1 ? player.x + player.w - 8 : player.x - 35,
          y: player.y + 8,
          w: 42, h: 42
        };
        if (rectsCollide(hb, enemy)) {
          const dmg = player.state === 'special' ? 17 : player.state === 'kick' ? 11 : 8;
          enemy.health = Math.max(0, enemy.health - dmg);
          enemy.x += player.facing * 14;
          player.attackTimer = 7;
          play('hit');
        }
      }
    }

    function updateEnemy() {
      if (roundOver || gameOver) return;

      enemy.aiTimer--;
      const dist = player.x - enemy.x;
      enemy.facing = dist > 0 ? 1 : -1;

      if (enemy.cooldown <= 0 && Math.abs(dist) < 95 && enemy.aiTimer <= 0) {
        if (Math.random() < 0.65) {
          enemy.state = 'punch';
          enemy.attackTimer = 20;
          enemy.cooldown = 38;
          play('punch');
        }
        enemy.aiTimer = 25 + Math.random() * 35;
      } else if (Math.abs(dist) > 110) {
        enemy.vx = enemy.facing * enemy.speed;
      } else {
        enemy.vx = 0;
      }

      if (Math.random() < 0.004 && enemy.y >= GROUND) {
        enemy.vy = -13;
      }

      enemy.vy += 0.72;
      enemy.x += enemy.vx;
      enemy.y += enemy.vy;
      if (enemy.y > GROUND) { enemy.y = GROUND; enemy.vy = 0; }
      enemy.x = Math.max(15, Math.min(W - enemy.w - 15, enemy.x));

      if (enemy.attackTimer > 0) enemy.attackTimer--;
      else enemy.state = 'idle';
      if (enemy.cooldown > 0) enemy.cooldown--;

      if (enemy.attackTimer > 11) {
        const hb = {
          x: enemy.facing === 1 ? enemy.x + enemy.w - 8 : enemy.x - 32,
          y: enemy.y + 12,
          w: 38, h: 38
        };
        if (rectsCollide(hb, player)) {
          player.health = Math.max(0, player.health - 9);
          player.x += enemy.facing * 11;
          enemy.attackTimer = 6;
          play('hit');
        }
      }
    }

    function checkRound() {
      if (roundOver) return;
      if (player.health <= 0 || enemy.health <= 0) {
        roundOver = true;
        if (player.health <= 0) {
          enemy.wins++;
          message = 'GREEDY WIFE WINS THE ROUND!';
          play('lose');
        } else {
          player.wins++;
          message = 'SPARROW WINS THE ROUND!';
          play('win');
        }
        messageTimer = 130;
        if (player.wins >= 2 || enemy.wins >= 2) {
          gameOver = true;
          message = player.wins >= 2 ? '★ SPARROW WINS THE MATCH! ★' : 'GREEDY WIFE WINS THE MATCH!';
        }
      }
    }

    function resetRound() {
      player.x = 140; player.y = GROUND; player.health = 100; player.vy = 0; player.state = 'idle';
      enemy.x = 610;  enemy.y = GROUND; enemy.health = 100;  enemy.vy = 0; enemy.state = 'idle';
      roundOver = false;
      round++;
      message = '';
    }

    // ===== Main Loop =====
    function gameLoop() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      updatePlayer();
      updateEnemy();
      checkRound();
      drawSparrow(player);
      drawWife(enemy);
      drawHealthBars();

      if (message) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(W/2 - 240, H/2 - 45, 480, 90);
        ctx.fillStyle = '#ffde59';
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(message, W/2, H/2 + 8);
        ctx.textAlign = 'left';
        messageTimer--;
        if (messageTimer <= 0 && !gameOver) resetRound();
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Refresh the page to play again', W/2, H/2 + 55);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
